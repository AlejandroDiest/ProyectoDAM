<html lang="es">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="../css/Style.css">
</head>
<body>
    <img src="../imagenes/imagenm-removebg-preview.png"   alt="Salesianos Zaragoza" id="logo">
    <div id="login_recuadro">
        <h1> LOGIN </h1>
        <input  type="email"  id="email"   name="email"   required placeholder="Correo"/>
        <br>
        <br>
        <input  type="password" id="password" name="password" required placeholder="Contraseña"/>
        <p><button type="submit" id="boton_login" onclick="IniciarSesion()">Iniciar sesión</button></p>
    </div>
    <script src="../js/script.js"></script>
</body>

</html>
